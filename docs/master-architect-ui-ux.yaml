# ------------------------------------------------------------------------------
# SECTION 1: ARCHITECTURAL PHILOSOPHY & SENIOR CRAFTSMANSHIP PRINCIPLES
# ------------------------------------------------------------------------------
architectural_philosophy:
  foundational_mantras:
    - mantra: 'Dignity over Novelty'
      elaboration: 'A 32-year-old charitable institution commands solemn trust, transparency, and gravitas. Gimmicky 3D cards, cartoonish micro-animations, or flashy gradient meshes are strictly forbidden. Every line, border, and typeface must reflect authentic institutional honor.'
    - mantra: 'Defensive Viewport Engineering'
      elaboration: 'Never assume standard 1920x1080 resolution. The interface must effortlessly perform on 320px foldables, iPad split screens, ultra-wide 4K monitors, and budget mobile screens with browser toolbars.'
    - mantra: 'Zero Accidental Overlap Architecture'
      elaboration: 'All modal drawers, floating dialogs, toolbars, and popups must establish explicit flex/grid container heights with independent scrollable viewports. Never permit an element to obscure another element without a clear scrim or backdrop barrier.'
    - mantra: 'High-Fidelity Accessibility as Baseline'
      elaboration: 'WCAG 2.2 AAA is not an afterthought; it is our ethical duty. Many beneficiaries, elderly patrons, and government officials navigate with assistive readers or high-contrast requirements.'
    - mantra: 'Authentic Indian Classical & Rural Resonance'
      elaboration: 'Audio, typography, and color tokens must honor the soil, khadi texture, river waters, and classical raga traditions of North and South India.'

# ------------------------------------------------------------------------------
# SECTION 2: DESIGN SYSTEM TOKENS & TYPOGRAPHIC SPECIFICATIONS
# ------------------------------------------------------------------------------
design_tokens:
  color_system:
    brand_palette:
      spruce_900: '#123F48' # Deepest evergreen spruce; primary ink for headlines and dominant leadership banners
      spruce_800: '#195560' # Primary brand anchor; institutional headers, primary buttons, active interactive badges
      teal_700:   '#236873' # Regal peacock teal; subtitles, section eyebrows, verified audit markers
      teal_600:   '#2D7D88' # Interactive hover state; links, tabs, breadcrumbs
      teal_500:   '#3B8E98' # Soft accent brand stroke; card hover borders, graphic line delimiters
      teal_300:   '#85C1C7' # Feathered background radial wash and dialog focus rings
      teal_200:   '#B9DDE0' # High-contrast crisp border; modal card frames, subtle separators
      teal_100:   '#DDEEEF' # Light tint for selected track rows and callout backgrounds
      teal_50:    '#F0F8F8' # Pure tinted foundation wash; light background sections
    neutrals_and_surfaces:
      canvas_warm:     '#FCFBF8' # Warm unbleached khadi parchment; primary page background
      surface_pure:    '#FFFFFF' # 100% Opaque card surface; zero translucent bleed through
      surface_sand_50: '#FDFCF9' # Secondary alternate section background
      surface_sand_100:'#F7F5EE' # Muted pill background, non-active control trays
      border_crisp:    '#E2E8F0' # 1px sharp structural division
      border_highlight:'#CBD5E1' # Focus indicator and active form boundary
    typography_ink:
      ink_primary:   '#0F172A' # Slate-900; 100% black equivalent for pristine readability
      ink_secondary: '#334155' # Slate-700; authoritative descriptive paragraph text
      ink_muted:     '#475569' # Slate-600; auxiliary metadata, photo captions, timestamps
      ink_subtle:    '#64748B' # Slate-500; track numbers, secondary tags, inactive indicators
    functional_accents:
      emerald_active: '#059669' # Live pulse indicators, operational metrics, playing status
      emerald_surface:'#ECFDF5' # Emerald card tint for active soundscape playback
      brass_gold:     '#B4833E' # 30 Years of Service emblem, ceremonial seals, commemorative awards
      crimson_alert:  '#DC2626' # Urgent alerts, statutory disclosures, emergency medical appeals

  typography_scales:
    font_families:
      editorial_display: 'Source Serif 4, Georgia, serif'
      functional_body:   'Public Sans, -apple-system, BlinkMacSystemFont, sans-serif'
      technical_mono:    'JetBrains Mono, Menlo, monospace'
    type_scale_hierarchy:
      display_hero:      'clamp(2.75rem, 5vw, 4.25rem) / line-height: 1.08 / tracking: -0.025em'
      display_section:   'clamp(2.0rem, 3.5vw, 2.75rem) / line-height: 1.15 / tracking: -0.02em'
      heading_h2:        'clamp(1.5rem, 2.5vw, 2.0rem)  / line-height: 1.25 / tracking: -0.015em'
      heading_h3:        'clamp(1.25rem, 2vw, 1.5rem)   / line-height: 1.3  / tracking: -0.01em'
      body_large:        '1.125rem (18px) / line-height: 1.65 / tracking: normal'
      body_standard:     '1.0rem (16px)    / line-height: 1.6  / tracking: normal'
      body_compact:      '0.875rem (14px)  / line-height: 1.5  / tracking: normal'
      caption_legal:     '0.75rem (12px)   / line-height: 1.45 / tracking: 0.01em'
      micro_tag:         '0.625rem (10px)  / line-height: 1.2  / tracking: 0.08em / uppercase / font-extrabold'

