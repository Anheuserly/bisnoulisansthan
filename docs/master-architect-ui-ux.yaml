# ------------------------------------------------------------------------------
# SECTION 6: ENGINEERING RIGOR & DEFENSIVE CODING PROTOCOLS
# ------------------------------------------------------------------------------
engineering_rigor:
  hydration_rules:
    - rule: 'Never invoke window, document, or localStorage during server render.'
      remedy: 'Wrap browser-only checks inside useEffect hooks or dynamic imports with ssr: false.'
    - rule: 'Never generate non-deterministic outputs (Math.random(), Date.now()) inside SSR markup.'
      remedy: 'Precompute random seeds or generate IDs inside a post-hydration state hook.'
  css_rules:
    - rule: 'Never use arbitrary fixed heights that can clip on multi-line translations.'
      remedy: 'Use min-height with flex-col, flex-1, and line-clamp-2 / line-clamp-3 defensive fallbacks.'
    - rule: 'Ensure all dialogs and drawers have pointer-events isolation.'
      remedy: 'Backdrop scrims must capture outer clicks without firing accidental clicks on underlying links.'
  state_management:
    - rule: 'User audio preferences must silently synchronize to localStorage.'
      keys:
        volume: 'bsgss_ambient_volume'
        muted: 'bsgss_ambient_muted'
        track_id: 'bsgss_ambient_track_id'
        user_stopped: 'bsgss_ambient_stopped'
  build_verification:
    - command: 'npm run build'
      target: 'Zero TypeScript compilation warnings, zero ESLint breakages, all 74 Next.js routes statically verified.'

