# ------------------------------------------------------------------------------
# SECTION 9: NIELSEN-NORMAN 10 HEURISTICS APPLIED TO BSGSS DESIGN SYSTEM
# ------------------------------------------------------------------------------
ux_heuristics_implementation:
  heuristic_1_visibility_of_system_status:
    standard: 'The user must always be informed about what is occurring.'
    implementation:
      - 'Animated 4-bar equalizer continuously displays live audio playback.'
      - 'Active track in soundscape drawer carries emerald beacon and explicit Active badge.'
      - 'Loading states on donation submission display spinner and statutory verification step.'
  heuristic_2_match_between_system_and_real_world:
    standard: 'Speak the language of rural social impact, not developer jargon.'
    implementation:
      - 'Terms like SHG Federation, Gramodyog, Gram Panchayat, and Sarvodaya replace corporate speak.'
      - 'Indian classical ragas are labelled with their time-of-day moods (Prabhat, Sandhya, Ratri).'
  heuristic_3_user_control_and_freedom:
    standard: 'Emergency exits must be clearly marked.'
    implementation:
      - 'Audio drawer modal features clear ✕ close button, backdrop click dismissal, and Esc key bind.'
      - 'Instant mute button suppresses audio immediately with one tap.'
  heuristic_4_consistency_and_standards:
    standard: 'Elements that look identical must behave identically.'
    implementation:
      - 'All buttons adhere to primary brand-700 solid or secondary brand-50 bordered styles.'
      - 'All typography follows strict Public Sans and Source Serif 4 pairings.'
  heuristic_5_error_prevention:
    standard: 'Prevent errors before they occur.'
    implementation:
      - 'Forms validate PAN card syntax and 10-digit Indian phone numbers prior to network submission.'
      - 'Defensive flexbox height clamping prevents drawer buttons from pushing offscreen.'
  heuristic_6_recognition_rather_than_recall:
    standard: 'Make objects, actions, and options visible.'
    implementation:
      - 'Soundscape drawer offers 6 category filter chips so users need not guess raga names.'
      - 'Search bar live filters matching ragas, instruments, frequencies, and rivers on keystroke.'
  heuristic_7_flexibility_and_efficiency_of_use:
    standard: 'Cater to both novice rural visitors and busy corporate CSR directors.'
    implementation:
      - 'CSR directors can jump straight to download 80G, CSR-1, and 30 partner audits.'
      - 'Villagers can review photo galleries and contact community health clinics in one tap.'
  heuristic_8_aesthetic_and_minimalist_design:
    standard: 'Eliminate irrelevant or rarely needed information.'
    implementation:
      - 'No visual clutter, no auto-opening advertisements, no intrusive tracking popups.'
      - 'Subtle micro-shadows replace harsh outlines.'
  heuristic_9_help_users_recognize_and_recover_from_errors:
    standard: 'Error messages must be expressed in plain language.'
    implementation:
      - 'Donation form errors explicitly explain invalid UPI ID or missing donor address.'
  heuristic_10_help_and_documentation:
    standard: 'Provide concise, contextual help whenever necessary.'
    implementation:
      - 'Tax benefit badges explain 50% deduction under Section 80G with Govt. order number.'

# ------------------------------------------------------------------------------
# SECTION 10: CODEBASE ARCHITECTURAL INTEGRITY & CONTINUOUS DEPLOYMENT
# ------------------------------------------------------------------------------
codebase_standards:
  git_commit_conventions:
    feat: 'A new user-facing feature or enhancement (e.g., feat(audio): add 112 soundscapes)'
    fix: 'A bug fix or layout contrast repair (e.g., fix(audio): repair drawer text overlap)'
    refactor: 'Code restructuring that neither fixes a bug nor adds a feature'
    docs: 'Documentation updates only (e.g., docs: update master architect YAML)'
    style: 'Changes that do not affect code logic (formatting, whitespace)'
    perf: 'Code change that improves execution performance'
    test: 'Adding missing unit or component tests'
  performance_budgets:
    max_initial_js_bundle_kb: 180
    max_lcp_seconds_mobile: 2.2
    max_cls_score: 0.02
    target_lighthouse_scores:
      performance: 98
      accessibility: 100
      best_practices: 100
      seo: 100
  institutional_verification_seal:
    certified_by: 'Office of the Master Architect, BSGSS'
    date_ratified: '2026-10-18'
    status: 'CANONICAL_RATIFIED'
