# ------------------------------------------------------------------------------
# SECTION 4: MASTER UI/UX COMPONENT SPECIFICATIONS
# ------------------------------------------------------------------------------
component_specifications:
  ambient_sound_player:
    role: 'Primary continuous acoustic companion for visitors exploring BSGSS work'
    dock_pill:
      location: 'fixed bottom-4 left-4 sm:bottom-6 sm:left-6 z-40'
      container: 'flex items-center gap-2.5 rounded-full border border-slate-200/90 bg-white/95 px-3 py-2 shadow-2xl backdrop-blur-xl ring-1 ring-black/5'
      elevation: 'High-lift shadow to remain crisp over dark banners or light footer ribbons'
      controls:
        play_toggle: '36px circular button in brand-700 with high-contrast white pause/play icon'
        track_skip_prev: '28px circular button cycling backward through 112 tracks with zero audio glitch'
        track_skip_next: '28px circular button cycling forward through 112 tracks with persistent memory'
        equalizer_bars: '4-bar staggered CSS pulse animation mimicking real-time acoustic resonance'
        track_label: 'Crisp bold slate-900 track title with emerald blinking active beacon'
        mute_toggle: 'Instant volume-0 suppression with amber alert glyph when muted'
        library_drawer_toggle: '32px settings glyph toggling the 112-track master selection drawer'
    soundscape_drawer_modal:
      placement: 'fixed bottom-20 left-4 sm:bottom-24 sm:left-6 z-50 w-[calc(100vw-2rem)] sm:w-[28rem] h-[34rem] max-h-[85vh]'
      backdrop_scrim: 'fixed inset-0 z-40 bg-slate-900/20 backdrop-blur-[2px] transition-opacity'
      shell_styling: 'flex flex-col rounded-3xl border-2 border-slate-200 bg-white p-5 shadow-[0_25px_70px_-15px_rgba(15,23,42,0.35)] ring-1 ring-black/5'
      layout_contract:
        rule_1: 'Header must be shrink-0 with explicit close button, title, and total track count badge.'
        rule_2: 'Controls container must be shrink-0 containing Now Playing banner, volume slider, search input, and category chips.'
        rule_3: 'Track list must be flex-1 overflow-y-auto, strictly preventing chips or search from overlapping song rows.'
        rule_4: 'Footer must be shrink-0 with active count summary and Done dismiss button.'
      now_playing_banner:
        styling: 'rounded-2xl border border-emerald-200 bg-emerald-50/90 p-3 flex items-center justify-between'
        indicators: 'Pulsing emerald dot, high-contrast bold slate-900 title, green genre tag, and Playing/Paused pill'
      search_and_filters:
        search_input: 'Rounded-xl border-2 border-slate-200 bg-slate-50/80 px-3 py-2 text-xs text-slate-900 focus:border-brand-600 focus:bg-white'
        category_chips:
          - 'All Tracks (112)'
          - 'Classical Ragas'
          - 'Nature & Rivers'
          - 'Healing 432Hz/Om'
          - 'Sitar & Flute Solo'
          - 'Ambient Pads'
      track_card_items:
        styling: 'rounded-2xl p-3 flex items-start gap-3 transition-all border text-left'
        active_state: 'bg-brand-50 border-2 border-brand-600 shadow-sm ring-1 ring-brand-400'
        idle_state: 'bg-slate-50/60 hover:bg-slate-100/90 border-slate-200/80'
        elements:
          track_number: 'Rounded-xl 32px badge displaying track number or active play arrowhead'
          title: 'Truncated bold slate-900 title with Active badge when selected'
          genre: 'Vibrant teal-700 label identifying the instrument, frequency, or geographic root'
          description: '2-line clamped slate-600 concise poetic description of the soundscape'

